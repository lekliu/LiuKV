version: '3.8'

services:
  liukv:
    image: liukv:latest
    container_name: liukv
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - AUTH_TOKEN=KV123456
      - MAX_MEMORY_MB=256
      - ENABLE_CORS=true
      - CORS_ORIGIN=*
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    external:
      name: nginx_mysql_default